<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Board - Conduit Hunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        .travel-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .current-location {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #00ff00;
            border-radius: 5px;
        }

        .location-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .location-name {
            font-size: 1.5em;
            color: #00ff00;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            font-size: 1.1em;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #fff;
            font-weight: bold;
        }

        .markka-value {
            color: #ffd700;
        }

        .airport-board {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 5px;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .board-title {
            font-size: 1.3em;
            color: #00ffff;
        }

        .conduit-progress {
            color: #ffaa00;
            font-size: 1.1em;
        }

        .destinations-table {
            width: 100%;
            border-collapse: collapse;
        }

        .destinations-table th {
            background: rgba(0, 255, 255, 0.2);
            padding: 10px;
            text-align: left;
            color: #00ffff;
            border-bottom: 2px solid #00ffff;
        }

        .destinations-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #333;
        }

        .destination-row {
            cursor: pointer;
            transition: background 0.2s;
        }

        .destination-row:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        .destination-row.selected {
            background: rgba(0, 255, 0, 0.2);
        }

        .destination-row.visited {
            opacity: 0.7;
        }

        .destination-row.conduit-found {
            background: rgba(255, 170, 0, 0.1);
        }

        .destination-row.conduit-closed {
            background: rgba(255, 0, 0, 0.1);
        }

        .airport-name {
            color: #fff;
            font-weight: bold;
        }

        .airport-iata {
            color: #aaa;
            font-size: 0.9em;
        }

        .distance {
            color: #00ffff;
        }

        .cost {
            color: #ffd700;
        }

        .conduit-indicator {
            font-size: 1.2em;
        }

        .conduit-open {
            color: #ffaa00;
        }

        .conduit-closed {
            color: #ff0000;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 12px 24px;
            font-size: 1.1em;
            border: 2px solid;
            border-radius: 5px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            transition: all 0.3s;
        }

        .action-button:hover {
            transform: scale(1.05);
        }

        .action-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .travel-button {
            border-color: #00ff00;
        }

        .travel-button:hover:not(:disabled) {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .rest-button {
            border-color: #00ffff;
        }

        .rest-button:hover:not(:disabled) {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .close-conduit-button {
            border-color: #ffaa00;
        }

        .close-conduit-button:hover:not(:disabled) {
            background: rgba(255, 170, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
        }

        .back-button {
            border-color: #ff00ff;
        }

        .back-button:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .message-box {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }

        .message-box.success {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #00ff00;
        }

        .message-box.error {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            color: #ff0000;
        }

        .message-box.info {
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            color: #00ffff;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00ffff;
            font-size: 1.3em;
        }

        /* Map Animation Styles */
        .travel-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 20px);
            padding: 10px;
            background: #1a1a1a;
        }

        .travel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .map-panel {
            flex: 0 0 40%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            border: 2px solid #1a3333;
        }

        .map-title {
            color: #00ffff;
            margin: 0 0 15px 0;
            font-size: 1.2em;
            font-weight: bold;
        }

        .map-container {
            position: relative;
            flex: 1;
            min-height: 400px;
            border: 2px solid #1a3333;
            border-radius: 5px;
            overflow: hidden;
        }

        /* Leaflet map styling */
        #leafletMap {
            width: 100%;
            height: 100%;
            background-color: #0a0f1e;
        }

        .leaflet-container {
            font-family: Arial, sans-serif;
            filter: brightness(0.8) contrast(1.2) saturate(0.8);
        }

        .leaflet-control {
            background: rgba(0, 0, 0, 0.7) !important;
            border: 1px solid #1a3333 !important;
            filter: brightness(1.2);
        }

        .leaflet-control a {
            color: #00ffff !important;
        }

        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            background-color: #1a3a5f !important;
            border-color: #5fd1ff !important;
        }

        .leaflet-control-zoom-in:hover,
        .leaflet-control-zoom-out:hover {
            background-color: #28527a !important;
        }

        .airport-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            border: 2px solid #00ffff;
            transition: all 0.3s ease;
        }

        .airport-dot:hover {
            width: 16px;
            height: 16px;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.9);
        }

        .airport-dot.current-location {
            background: #00ff00;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.8);
            width: 14px;
            height: 14px;
        }

        .airport-dot.visited {
            opacity: 0.6;
        }

        .airport-label {
            position: absolute;
            transform: translate(-50%, -130%);
            font-size: 0.8rem;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            pointer-events: none;
        }

        .airport-label.current {
            color: #00ff00;
            font-size: 0.9rem;
        }

        .plane-icon {
            position: absolute;
            font-size: 24px;
            color: #ffffff;
            text-shadow: 0 0 8px #1e90ff, 0 0 4px #1e90ff;
            transform: translate(-50%, -50%) rotate(0deg);
            pointer-events: none;
            animation: planePulse 0.8s infinite alternate ease-in-out;
        }

        @keyframes planePulse {
            0% { transform: translate(-50%, -50%) rotate(-2deg) scale(1); }
            100% { transform: translate(-50%, -50%) rotate(2deg) scale(1.1); }
        }

        .route-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .route-path {
            stroke: #1e90ff;
            stroke-width: 3;
            stroke-dasharray: 10 6;
            fill: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .route-path.visible {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="travel-layout">
        <div class="travel-content">
        <!-- Help Button -->
        <button class="help-button" id="btn-help" title="Help">?</button>

        <!-- Current Location Display -->
        <div class="current-location">
            <div class="location-info">
                <div>
                    <div class="location-name" id="currentLocationName">Loading...</div>
                    <div class="airport-iata" id="currentLocationIata"></div>
                </div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <span class="stat-label">Markka:</span>
                        <span class="stat-value markka-value" id="markkaDisplay">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">HP:</span>
                        <span class="stat-value" id="hpDisplay">100</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Sanity:</span>
                        <span class="stat-value" id="sanityDisplay">100</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Doom:</span>
                        <span class="stat-value" id="travelDoomValue" style="color: #ff6b6b;">100/100</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message Box -->
        <div class="message-box" id="messageBox"></div>

        <!-- Airport Board -->
        <div class="airport-board">
            <div class="board-header">
                <div class="board-title">Available Destinations</div>
                <div class="conduit-progress" id="conduitProgress">Conduits: 0/0</div>
            </div>

            <div id="loadingIndicator" class="loading">
                Loading destinations...
            </div>

            <table class="destinations-table" id="destinationsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Airport</th>
                        <th>Country</th>
                        <th>Distance (km)</th>
                        <th>Cost (₥)</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="destinationsBody">
                </tbody>
            </table>

            <div class="action-buttons">
                <button class="action-button travel-button" id="travelButton" disabled>
                    Travel to Selected Airport
                </button>
                <button class="action-button rest-button" id="restButton">
                    Rest Here (Restore HP/Sanity)
                </button>
                <button class="action-button close-conduit-button" id="closeConduitButton" disabled>
                    Close Conduit
                </button>
                <button class="action-button" id="inventoryButton" onclick="window.location.href='/inventory?from=travel'">
                    Inventory
                </button>
            </div>
        </div>
        </div>

        <div class="map-panel">
            <h3 class="map-title">Flight Map</h3>
            <div class="map-container" id="leafletMap"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/travel.js') }}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Travel page loaded');
            
            // Initialize help modal
            if (typeof UI !== 'undefined' && UI.initializeHelpModal) {
                UI.initializeHelpModal();
            }
            
            // Initialize AudioManager and play travel music
            if (window.AudioManager) {
                console.log('Initializing AudioManager...');
                await window.AudioManager.init();
                console.log('AudioManager initialized, playing music...');
                await window.AudioManager.playEvent('travel_airport');
            } else {
                console.error('AudioManager not available!');
            }
            
            // Initialize travel manager (TravelManager class is defined in travel.js)
            if (typeof TravelManager !== 'undefined') {
                const travelMgr = new TravelManager();
                await travelMgr.init();
            } else {
                console.error('TravelManager not available!');
            }
        });
    </script>
</body>
</html>
