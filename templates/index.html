<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rites of Transit - A Lovecraftian Horror RPG</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
</head>
<body>
    <div id="app">
        <!-- Game will be rendered here by JavaScript -->
        <div id="loading">
            <h1>Loading Rites of Transit...</h1>
            <p>Preparing your descent into madness...</p>
        </div>
    </div>

    <!-- Include JavaScript modules -->
    <script src="{{ url_for('static', filename='js/api.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/audio.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/settings.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/game.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
