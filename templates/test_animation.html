<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            height: 600px;
        }

        .controls {
            flex: 0 0 250px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #444;
        }

        .controls h2 {
            margin-top: 0;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #005a9e;
        }

        .info {
            background: #3a3a3a;
            padding: 10px;
            border-radius: 3px;
            font-size: 12px;
            margin-bottom: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .map-panel {
            flex: 1;
            background: #2a2a2a;
            border-radius: 5px;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
        }

        .airport-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            border: 2px solid #00ffff;
        }

        .airport-dot.current {
            background: #00ff00;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.8);
            width: 14px;
            height: 14px;
        }

        .airport-label {
            position: absolute;
            transform: translate(-50%, -130%);
            font-size: 0.8rem;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            pointer-events: none;
        }

        .plane-icon {
            position: absolute;
            font-size: 24px;
            color: #ffffff;
            text-shadow: 0 0 8px #1e90ff, 0 0 4px #1e90ff;
            transform: translate(-50%, -50%) rotate(0deg);
            pointer-events: none;
        }

        .route-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .route-path {
            stroke: #1e90ff;
            stroke-width: 3;
            stroke-dasharray: 10 6;
            fill: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .route-path.visible {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>Flight Animation Test</h1>

    <div class="container">
        <div class="controls">
            <h2>Controls</h2>
            <button onclick="addAirports()">Load Airports</button>
            <button onclick="animateFromFirstToSecond()">Fly: First → Second</button>
            <button onclick="animateFromSecondToFirst()">Fly: Second → First</button>
            <button onclick="clearMap()">Clear Map</button>
            <div class="info" id="infoBox">
                Click "Load Airports" to start
            </div>
        </div>

        <div class="map-panel">
            <svg class="route-svg" id="routeSvg"></svg>
            <div id="mapContainer" style="width: 100%; height: 100%; position: relative;"></div>
        </div>
    </div>

    <script>
        const mapContainer = document.getElementById('mapContainer');
        const routeSvg = document.getElementById('routeSvg');
        let routePath = null;
        let planeEl = null;
        let planeAnimId = null;
        let airports = [];

        function log(msg) {
            const infoBox = document.getElementById('infoBox');
            const timestamp = new Date().toLocaleTimeString();
            infoBox.innerHTML += `<div>[${timestamp}] ${msg}</div>`;
            infoBox.scrollTop = infoBox.scrollHeight;
        }

        function initMap() {
            mapContainer.innerHTML = '';
            
            // Create SVG path
            routePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
            routePath.setAttribute("class", "route-path");
            routeSvg.appendChild(routePath);

            // Create plane
            planeEl = document.createElement("div");
            planeEl.className = "plane-icon";
            planeEl.textContent = "✈";
            mapContainer.appendChild(planeEl);

            log("Map initialized");
        }

        function generatePosition(name, index, total) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = ((hash << 5) - hash) + name.charCodeAt(i);
                hash = hash & hash;
            }
            hash = Math.abs(hash + index * 12345);
            
            const margin = 10;
            const x = ((hash % 100) * 0.8) + margin;
            const y = (((hash / 100) % 100) * 0.8) + margin;
            
            return {
                x: Math.min(x, 100 - margin),
                y: Math.min(y, 100 - margin)
            };
        }

        function addAirports() {
            log("Loading airports...");
            initMap();

            const airportCodes = ['HEL', 'LHR', 'CDG', 'JFK', 'DXB'];
            airports = [];

            airportCodes.forEach((code, index) => {
                const pos = generatePosition(code, index, airportCodes.length);
                
                const dot = document.createElement("div");
                dot.className = "airport-dot";
                if (index === 0) dot.classList.add("current");
                dot.style.left = pos.x + "%";
                dot.style.top = pos.y + "%";

                const label = document.createElement("div");
                label.className = "airport-label";
                label.style.left = pos.x + "%";
                label.style.top = pos.y + "%";
                label.textContent = code;

                mapContainer.appendChild(dot);
                mapContainer.appendChild(label);

                airports.push({ code, pos, dot, label });
                log(`Added airport ${code} at (${pos.x.toFixed(1)}%, ${pos.y.toFixed(1)}%)`);
            });

            planeEl.style.left = airports[0].pos.x + "%";
            planeEl.style.top = airports[0].pos.y + "%";
            planeEl.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            
            log("Airports loaded. Ready to animate.");
        }

        function setPlanePosition(xPercent, yPercent, angleDeg) {
            planeEl.style.left = xPercent + "%";
            planeEl.style.top = yPercent + "%";
            if (angleDeg !== null) {
                planeEl.style.transform = `translate(-50%, -50%) rotate(${angleDeg}deg)`;
            }
        }

        function animatePlane(from, to) {
            if (!from || !to) {
                log("ERROR: Invalid airports");
                return;
            }

            log(`Starting animation from ${from.code} to ${to.code}`);

            const rect = mapContainer.getBoundingClientRect();
            const x1 = (from.pos.x / 100) * rect.width;
            const y1 = (from.pos.y / 100) * rect.height;
            const x2 = (to.pos.x / 100) * rect.width;
            const y2 = (to.pos.y / 100) * rect.height;

            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            const offset = rect.height * 0.25;
            const cy = my - offset;

            const d = `M ${x1} ${y1} Q ${mx} ${cy} ${x2} ${y2}`;
            routePath.setAttribute("d", d);
            routePath.classList.add("visible");

            if (planeAnimId) cancelAnimationFrame(planeAnimId);

            const duration = 1600;
            const startTime = performance.now();

            const step = (now) => {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / duration);

                const x = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * mx + t * t * x2;
                const y = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * cy + t * t * y2;

                const dxdt = 2 * (1 - t) * (mx - x1) + 2 * t * (x2 - mx);
                const dydt = 2 * (1 - t) * (cy - y1) + 2 * t * (y2 - cy);
                const angleDeg = Math.atan2(dydt, dxdt) * 180 / Math.PI;

                const xPercent = (x / rect.width) * 100;
                const yPercent = (y / rect.height) * 100;

                setPlanePosition(xPercent, yPercent, angleDeg);

                if (t < 1) {
                    planeAnimId = requestAnimationFrame(step);
                } else {
                    log(`Animation complete! Arrived at ${to.code}`);
                    routePath.classList.remove("visible");
                }
            };

            planeAnimId = requestAnimationFrame(step);
        }

        function animateFromFirstToSecond() {
            if (airports.length < 2) {
                log("ERROR: Need at least 2 airports");
                return;
            }
            animatePlane(airports[0], airports[1]);
        }

        function animateFromSecondToFirst() {
            if (airports.length < 2) {
                log("ERROR: Need at least 2 airports");
                return;
            }
            animatePlane(airports[1], airports[0]);
        }

        function clearMap() {
            mapContainer.innerHTML = '';
            airports = [];
            log("Map cleared");
        }

        log("Ready. Click 'Load Airports' to begin.");
    </script>
</body>
</html>
