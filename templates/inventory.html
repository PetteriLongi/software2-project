<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Conduit Hunters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Reset and setup */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
        }

        /* Upper section (75% height) - Character & Equipment Display */
        .upper_section {
            height: 75vh;
            width: 100%;
            position: relative;
            background: url("{{ url_for('static', filename='images/backgrounds/inventory_bg.png') }}") center bottom/100% auto no-repeat;
            background-color: #0a0a0a;
        }

        /* Player stats overlay */
        .player_stats {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            color: #00ff00;
            font-family: monospace;
        }

        .stat_row {
            margin: 5px 0;
            font-size: 14px;
        }

        .stat_label {
            color: #aaa;
        }

        /* Mirror section (center-left) */
        .mirror_section {
            position: absolute;
            top: 24%;
            left: 30%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .mirror {
            position: relative;
            width: 200px;
            height: 300px;
        }

        .mirror img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .level_display {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 20px;
            border: 2px solid #ffd700;
            border-radius: 5px;
            color: #ffd700;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .mirror:hover .level_display {
            opacity: 1;
        }

        /* Gun rack section (top-right) */
        .gun_rack_section {
            position: absolute;
            top: 10%;
            right: 22%;
        }

        .gun_rack_title {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 15px;
            border: 2px solid #ff6600;
            border-radius: 5px;
            color: #ff6600;
            font-family: monospace;
            margin-bottom: 10px;
            text-align: center;
        }

        .gun_hooks {
            display: flex;
            gap: 15px;
            background: url("{{ url_for('static', filename='images/props/gunrack.png') }}") center/contain no-repeat;
            padding: 40px;
            min-width: 300px;
            min-height: 200px;
        }

        .gun_hook {
            position: relative;
            width: 80px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gun_hook:hover {
            transform: scale(1.1);
        }

        .gun_hook img.hook {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gun_hook img.weapon {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        .gun_hook.empty {
            opacity: 0.5;
        }

        /* Melee rack section (bottom-right) */
        .melee_section {
            position: absolute;
            bottom: 5%;
            right: 15%;
        }

        .melee_title {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 15px;
            border: 2px solid #cc0000;
            border-radius: 5px;
            color: #cc0000;
            font-family: monospace;
            margin-bottom: 10px;
            text-align: center;
        }

        .melee_rack {
            display: flex;
            gap: 15px;
        }

        .melee_slot {
            position: relative;
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #666;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .melee_slot:hover {
            border-color: #cc0000;
            transform: scale(1.05);
        }

        .melee_slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }

        /* Table with money (bottom-left) */
        .money_section {
            position: absolute;
            bottom: 5%;
            left: 20%;
        }

        .money_table {
            position: relative;
            width: 350px;
            height: 300px;
        }

        .money_table img.table {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .money_display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 20px;
            border: 2px solid #ffd700;
            border-radius: 5px;
            color: #ffd700;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .money_table:hover .money_display {
            opacity: 1;
        }

        /* Lower section (25% height) - Item Grids */
        .lower_section {
            height: 25vh;
            width: 100%;
            position: relative;
            background: url("{{ url_for('static', filename='images/inventory/LOWER_inventory8.png') }}") center/cover;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        /* Weapons Grid (Left) */
        .weapons_grid_container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .grid_title {
            color: #ff6600;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #ff6600;
            padding-bottom: 5px;
        }

        .weapons_grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            flex: 1;
        }

        /* Consumables Grid (Right) */
        .consumables_grid_container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .consumables_grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            flex: 1;
        }

        .inventory_slot {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #333;
            border-radius: 5px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inventory_slot:hover {
            border-color: #00ff00;
            background: rgba(0, 50, 0, 0.5);
            transform: scale(1.05);
        }

        .inventory_slot.occupied {
            border-color: #00ff00;
        }

        .inventory_slot img {
            max-width: 80%;
            max-height: 60%;
            object-fit: contain;
        }

        .item_name {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            font-family: monospace;
            font-size: 9px;
            color: #00ff00;
            text-align: center;
            white-space: normal;
            width: 90%;
            word-break: break-word;
            pointer-events: none;
        }

        .item_count {
            position: absolute;
            bottom: 2px;
            right: 5px;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            font-size: 12px;
            font-family: monospace;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .ammo_count {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ff9900;
            font-size: 9px;
            font-family: monospace;
            padding: 2px 5px;
            border-radius: 3px;
            pointer-events: none;
        }

        .item_tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            color: #00ff00;
            padding: 10px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            margin-bottom: 10px;
        }

        .inventory_slot:hover .item_tooltip {
            opacity: 1;
        }

        /* Action buttons */
        .action_buttons {
            position: absolute;
            top: 20px;
            right: 80px;
            display: flex;
            gap: 10px;
        }

        .action_button {
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .action_button:hover {
            background: rgba(0, 255, 0, 0.2);
            transform: scale(1.05);
        }

        .action_button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading overlay */
        .loading_overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading_overlay.active {
            display: flex;
        }

        .loading_text {
            color: #00ff00;
            font-family: monospace;
            font-size: 24px;
        }

        /* Message box */
        .message_box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 15px 30px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            color: #00ff00;
            font-family: monospace;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .message_box.visible {
            opacity: 1;
        }

        .message_box.error {
            border-color: #ff0000;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <!-- Upper Section: Equipment Display -->
    <div class="upper_section">
        <!-- Help Button -->
        <button class="help-button" id="btn-help" title="Help">?</button>

        <!-- Player Stats -->
        <div class="player_stats">
            <div class="stat_row">
                <span class="stat_label">HP:</span> 
                <span id="playerHp">100</span>/<span id="playerMaxHp">100</span>
            </div>
            <div class="stat_row">
                <span class="stat_label">Sanity:</span> 
                <span id="playerSanity">100</span>/<span id="playerMaxSanity">100</span>
            </div>
            <div class="stat_row">
                <span class="stat_label">Level:</span> 
                <span id="playerLevel">1</span>
            </div>
        </div>

        <!-- Mirror (Player Display) -->
        <div class="mirror_section">
            <div class="mirror">
                <img src="{{ url_for('static', filename='images/player/mirror1.png') }}" alt="Player Mirror">
                <div class="level_display" id="levelDisplay">Level 1</div>
            </div>
        </div>

        <!-- Gun Rack (Ranged Weapons) -->
        <div class="gun_rack_section">
            <div class="gun_rack_title">Ranged Weapons</div>
            <div class="gun_hooks" id="gunRack">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Melee Rack -->
        <div class="melee_section">
            <div class="melee_title">Melee Weapons</div>
            <div class="melee_rack" id="meleeRack">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Money Display -->
        <div class="money_section">
            <div class="money_table">
                <img class="table" src="{{ url_for('static', filename='images/props/table.png') }}" alt="Table">
                <div class="money_display">
                    ₥ <span id="moneyAmount">0</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action_buttons">
            <button class="action_button" id="backButton" data-referrer="{{ referrer }}">Back</button>
        </div>
    </div>

    <!-- Lower Section: Weapons and Consumables Grids -->
    <div class="lower_section">
        <!-- Weapons Grid (Left) -->
        <div class="weapons_grid_container">
            <div class="grid_title">Weapons</div>
            <div class="weapons_grid" id="weaponsGrid">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Consumables Grid (Right) -->
        <div class="consumables_grid_container">
            <div class="grid_title">Consumables</div>
            <div class="consumables_grid" id="consumablesGrid">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading_overlay" id="loadingOverlay">
        <div class="loading_text">Loading Inventory...</div>
    </div>

    <!-- Message Box -->
    <div class="message_box" id="messageBox"></div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/inventory.js') }}"></script>
    <script>
        // Initialize help modal after page loads
        document.addEventListener('DOMContentLoaded', async function() {
            if (typeof UI !== 'undefined' && UI.initializeHelpModal) {
                await UI.initializeHelpModal();
            }
        });
    </script>
</body>
</html>
